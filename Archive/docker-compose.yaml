version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: akm-postgis
    restart: always

    environment:
      POSTGRES_DB: akm_db
      POSTGRES_USER: akm_admin
      POSTGRES_PASSWORD: akmadmin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: